name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found, generating it..."
            gradle wrapper --gradle-version 8.7
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEMONITER_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/demoniter-release.jks

      - name: Build release APK
        env:
          DEMONITER_KEYSTORE_PATH: ../keystore/demoniter-release.jks
          DEMONITER_KEYSTORE_PASSWORD: ${{ secrets.DEMONITER_KEYSTORE_PASSWORD }}
          DEMONITER_KEY_ALIAS: ${{ secrets.DEMONITER_KEY_ALIAS }}
          DEMONITER_KEY_PASSWORD: ${{ secrets.DEMONITER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          
