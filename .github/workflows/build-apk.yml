name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEMONITER_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"

      - name: Build signed release APK
        env:
          DEMONITER_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.keystore
          DEMONITER_KEYSTORE_PASSWORD: ${{ secrets.DEMONITER_KEYSTORE_PASSWORD }}
          DEMONITER_KEY_ALIAS: ${{ secrets.DEMONITER_KEY_ALIAS }}
          DEMONITER_KEY_PASSWORD: ${{ secrets.DEMONITER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
