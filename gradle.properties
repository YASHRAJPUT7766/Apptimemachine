org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Works around an intermittent R8 ConcurrentModificationException crash
# (AGP 8.5.2's bundled R8) that occurs during parallel processing on
# some CI runners. Forces R8 to run single-threaded, which avoids the
# race condition at the cost of a slightly longer minify step.
android.r8.maxWorkers=1
